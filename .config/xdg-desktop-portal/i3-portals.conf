# Portal backend selection for the i3 session.
#
# Both xdg-desktop-portal-gnome and -gtk are installed (GNOME pulls the first
# one in), and both .portal files declare only `UseIn=gnome`. Under i3
# XDG_CURRENT_DESKTOP=i3, so neither matches, no i3-portals.conf existed, and
# xdg-desktop-portal fell back to picking a backend on its own — which lands on
# `gnome` (it sorts before `gtk`). That backend talks to gnome-shell D-Bus
# services that do not exist in an i3 session, so file pickers, screenshots and
# "open with" from Flatpak/Chromium apps hang or fail silently.
#
# Pin the GTK backend for i3. GNOME's own session keeps using
# /usr/share/xdg-desktop-portal/gnome-portals.conf, untouched.
#
# Secrets stay with gnome-keyring: its daemon is started by PAM for every GDM
# login regardless of session, so it is the working provider under i3 too.

[preferred]
default=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
