<touchégg>

  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
    <property name="color">auto</property>
    <property name="borderColor">auto</property>
  </settings>

  <application name="All">
    <!-- Swipe right (three fingers moving right) → Back -->
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Alt_L</modifiers>
        <keys>Left</keys>
      </action>
    </gesture>

    <!-- Swipe left (three fingers moving left) → Forward -->
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Alt_L</modifiers>
        <keys>Right</keys>
      </action>
    </gesture>

    <!-- Four fingers drive workspaces. RUN_COMMAND rather than SEND_KEYS:
         synthesising Super+Ctrl+Arrow depends on the modifiers not being
         swallowed and on the keysym resolving in the active layout, while
         i3-msg talks to i3 over its socket and is immune to both.

         next_on_output/prev_on_output, not next/prev: with the HDMI monitor
         attached, plain `next` walks onto workspaces living on the other
         screen and yanks focus off the display you just swiped on. -->

    <!-- Four fingers left → next workspace on this screen -->
    <gesture type="SWIPE" fingers="4" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>i3-msg workspace next_on_output</command>
        <on>begin</on>
      </action>
    </gesture>

    <!-- Four fingers right → previous workspace on this screen -->
    <gesture type="SWIPE" fingers="4" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>i3-msg workspace prev_on_output</command>
        <on>begin</on>
      </action>
    </gesture>

    <!-- Four fingers up → window overview (the closest i3 has to Mission
         Control). Same rofi flags as the $super+space launcher so it picks
         up the themed config instead of rofi's stock look. -->
    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>rofi -show window -no-default-config -config ~/.config/rofi/config.rasi</command>
        <on>begin</on>
      </action>
    </gesture>

    <!-- Four fingers down → jump back to the previously focused workspace -->
    <gesture type="SWIPE" fingers="4" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>i3-msg workspace back_and_forth</command>
        <on>begin</on>
      </action>
    </gesture>
  </application>

</touchégg>
